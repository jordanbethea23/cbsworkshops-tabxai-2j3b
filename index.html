<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBS Tableau AI Workshops</title>
<style>
:root{
  --bg:#ffffff; --surface:#f3f8fd; --fg:#032d60; --muted:#4f6a8c; --line:#d5e2f1;
  --blue:#0b5cab; --good:#2e844a; --bad:#ba0517; --btn-fg:#ffffff;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#06152b; --surface:#0d2240; --fg:#e8f1fb; --muted:#9db4d1; --line:#1d3860;
  --blue:#58a6f5; --good:#5cc17a; --bad:#f08a8f; --btn-fg:#06152b; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding:0 max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{line-height:1.05;text-wrap:balance;margin:0;font-weight:700}
a{color:var(--blue)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px 0;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.01em;text-decoration:none;color:var(--fg)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:14px;padding:6px 12px;border-radius:99px;text-decoration:none;color:var(--muted);border:1px solid var(--line)}
.nav a[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#032d60 0%,#0b5cab 45%,#1b96ff 100%);border-radius:20px;padding:clamp(24px,5vw,52px);display:grid;gap:22px;min-height:300px;align-content:center}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(44px,9vw,92px);letter-spacing:-.03em;font-weight:800}
.hero p{margin:0;max-width:60ch;font-size:18px;opacity:.93}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7fe3ff;font-weight:700}
.details{display:grid;grid-template-columns:1fr 1fr 1.6fr;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.details>div{padding:20px 24px;min-width:0}
.details>div+div{border-left:1px solid var(--line)}
.details span{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.details b{display:block;font-size:clamp(18px,2.2vw,22px);font-weight:600;line-height:1.3;letter-spacing:-.01em;color:var(--fg)}
@media(max-width:760px){.details{grid-template-columns:1fr}.details>div+div{border-left:0;border-top:1px solid var(--line)}}
.bars{position:absolute!important;right:clamp(8px,4vw,48px);bottom:0;z-index:0!important;display:flex;align-items:flex-end;gap:10px;height:85%;opacity:.55;pointer-events:none}
.bars i{display:block;width:clamp(14px,3vw,34px);border-radius:8px 8px 0 0;background:linear-gradient(#7fe3ff,#ffffff33);height:var(--h)}
.bars i:nth-child(2n){background:linear-gradient(#ffb75d,#ffffff22)}
@media(max-width:700px){.bars{opacity:.25}}
@media(prefers-reduced-motion:no-preference){
  .bars i{transform-origin:bottom;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms)}
  @keyframes rise{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
  .cities a{transition:transform .15s,box-shadow .15s}
}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:28px 0 8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:5px solid var(--blue)}
.topic:nth-child(2){border-top-color:#ff9a3c}.topic:nth-child(3){border-top-color:#2e844a}.topic:nth-child(4){border-top-color:#8b46ff}
.topic h3{font-size:20px;margin-bottom:6px}
.topic p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:32px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.col{min-width:0}
h2{font-size:28px;margin-bottom:14px}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.agenda time{font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums}
.agenda strong{display:block}
.req{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:#ba0517;color:#fff;font-size:11px;font-weight:700;font-style:normal;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
.agenda span{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
form{display:grid;gap:14px}
label{font-size:13px;font-weight:600;display:grid;gap:5px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{font:600 15px var(--body);background:var(--blue);color:var(--btn-fg);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(11,92,171,.35)}
a.btn{display:inline-block;text-decoration:none}
form{display:grid;gap:14px;position:relative}
label{font-size:13px;font-weight:600;display:grid;gap:5px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.tick{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--good);color:#fff;font-weight:700}
.done h3{font-size:26px;margin:6px 0 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.done h3{font-size:26px;margin:6px 0 8px}
.tick{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--good);color:#fff;font-weight:700}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:28px 0}
.cities a{display:grid;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.cities a:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(3,45,96,.15)}
.cities b{font-size:28px;letter-spacing:-.02em;color:var(--blue)}
.cities span{font-size:13px;color:var(--muted)}
footer{padding:36px 0 48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">CBS Tableau AI Workshops</a>
    <nav class="nav" id="nav" aria-label="Cities"></nav>
  </header>
  <main id="app"></main>
  <footer>CBS Tableau AI Workshops, hosted by Salesforce.</footer>
</div>

<script>
/* ===== CONFIG: paste your Apps Script web app URL (see SETUP.md) ===== */
/* ===== CONFIG: where "Register your interest" goes =====
   Put a link per city (a form, a Web-to-Lead page, an event page). Leave one blank to use the email fallback below. */
const REGISTER = {chicago:"https://docs.google.com/forms/d/e/1FAIpQLSfrYsku4l7Bxc-7EHhNlrlSK016cBZTg_byVP__NFtDdym5ww/viewform?usp=pp_url&entry.1577871348=Chicago", seattle:"https://docs.google.com/forms/d/e/1FAIpQLSfrYsku4l7Bxc-7EHhNlrlSK016cBZTg_byVP__NFtDdym5ww/viewform?usp=pp_url&entry.1577871348=Seattle", dallas:"https://docs.google.com/forms/d/e/1FAIpQLSfrYsku4l7Bxc-7EHhNlrlSK016cBZTg_byVP__NFtDdym5ww/viewform?usp=pp_url&entry.1577871348=Dallas", nyc:"https://docs.google.com/forms/d/e/1FAIpQLSfrYsku4l7Bxc-7EHhNlrlSK016cBZTg_byVP__NFtDdym5ww/viewform?usp=pp_url&entry.1577871348=New+York+City", atlanta:"https://docs.google.com/forms/d/e/1FAIpQLSfrYsku4l7Bxc-7EHhNlrlSK016cBZTg_byVP__NFtDdym5ww/viewform?usp=pp_url&entry.1577871348=Atlanta"};
const FORM_ENDPOINT = "";
// Google Form question IDs (from the form's pre-filled link)
const ENTRY = {city:"entry.1577871348", name:"entry.343721570", title:"entry.33747139", email:"entry.309262103", company:"entry.250593279", uses_tableau:"entry.189809138", laptop:"entry.265688842", account_executive:"entry.961026446", notes:"entry.1202183667"};
const FALLBACK_EMAIL = "";   // e.g. "workshops@salesforce.com". Opens a prefilled email.

const CITIES = {
  chicago: {name:"Chicago",       date:"Tuesday, December 8, 2026", time:"1:00 – 5:00 pm CST", venue:"Salesforce Tower Chicago, 333 W Wolf Point Plaza, Chicago, IL 60654"},
  seattle: {name:"Seattle",       date:"Wednesday, December 9, 2026", time:"1:00 – 5:00 pm PST", venue:"Salesforce Data1, 744 N 34th St, Seattle, WA 98103"},
  dallas:  {name:"Dallas",        date:"Thursday, December 10, 2026", time:"1:00 – 5:00 pm CST", venue:"Salesforce Dallas, 2300 N Field St, Dallas, TX 75201"},
  nyc:     {name:"New York City", date:"Wednesday, December 9, 2026", time:"1:00 – 5:00 pm EST", venue:"Salesforce Tower New York, 1095 Avenue of the Americas, New York, NY 10036"},
  atlanta: {name:"Atlanta",       date:"Tuesday, December 8, 2026", time:"8:00 am – 12:00 pm EST", part:"morning", venue:"Salesforce Tower Atlanta, 950 E Paces Ferry Rd NE, Atlanta, GA 30326"}
};
const TABLEAU_OPTS = ["No, we don't","Yes, Tableau Server","Yes, Tableau Cloud","Yes, Tableau Next or CRMA","Yes, mix of Tableau products"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const route = () => (location.hash || "").slice(1).toLowerCase();

const BARS = `<div class="bars" aria-hidden="true">${[40,62,48,78,58,92,70,100].map((h,i)=>`<i style="--h:${h}%;--i:${i}"></i>`).join("")}</div>`;
const TOPICS = `<div class="topics">
  <div class="topic"><h3>Tableau Pulse</h3><p>Metrics that find you. Build one and subscribe your team.</p></div>
  <div class="topic"><h3>AI agents</h3><p>Ask questions in plain language and let an agent do the analysis.</p></div>
  <div class="topic"><h3>Tableau Studio</h3><p>Go from data to dashboard faster with the new authoring experience.</p></div>
  <div class="topic"><h3>MCP integrations</h3><p>Connect Tableau to Claude, Slack, or any front end you use.</p></div></div>`;

function nav(){
  const r = route();
  $("#nav").innerHTML = Object.entries(CITIES).map(([k,c]) => `<a href="#${k}" ${r===k?'aria-current="true"':''}>${c.name}</a>`).join("");
}
function home(){
  return `<section class="hero">${BARS}<div class="eyebrow">CBS Tableau AI Workshops</div>
    <h1>Get hands-on with Tableau and AI.</h1>
    <p>Bring a laptop and spend a half day with Pulse, AI agents, Tableau Studio, and MCP integrations with Claude and Slack. Pick your city to register your interest.</p></section>
    <div class="cities">${Object.entries(CITIES).map(([k,c])=>`<a href="#${k}"><b>${c.name}</b><span>${esc(c.date)}</span><span>${esc(c.venue)}</span></a>`).join("")}</div>`;
}
function registerLink(k){
  const c = CITIES[k];
  if (REGISTER[k]) return REGISTER[k];
  if (FALLBACK_EMAIL) {
    const body = ["Name:","Job title:","Work email:","Company:",
      "Do you currently use Tableau? (No / Server / Cloud / Tableau Next or CRMA / Mix):",
      "Can you bring a laptop and charger? (Yes / No):",
      "Your Salesforce account executive:","Anything else? Prefer another date or city?:"].join("\n\n");
    return "mailto:" + FALLBACK_EMAIL + "?subject=" + encodeURIComponent("CBS Tableau AI Workshop: " + c.name + " - register my interest") + "&body=" + encodeURIComponent(body);
  }
  return "";
}
let sent = {}, busy = false, formErr = "";
function formCard(k){
  if (sent[k]) return `<div class="card done"><span class="tick" aria-hidden="true">✓</span><h3>Thanks for registering your interest</h3><p>Your account team will be in touch to confirm your place.</p></div>`;
  return `<div class="card"><h2>Register your interest</h2>
  <form id="reg" novalidate>
    <input type="text" name="company_website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <label for="f-name">Full name <input id="f-name" name="name" autocomplete="name" required></label>
    <label for="f-title">Job title <input id="f-title" name="title" autocomplete="organization-title" required></label>
    <label for="f-email">Work email <input id="f-email" name="email" type="email" autocomplete="email" required></label>
    <label for="f-company">Company <input id="f-company" name="company" autocomplete="organization" required></label>
    <label for="f-tab">Do you currently use Tableau? <select id="f-tab" name="uses_tableau" required><option value="">Choose</option>${TABLEAU_OPTS.map(o=>`<option>${esc(o)}</option>`).join("")}</select></label>
    <label for="f-laptop">Can you bring a laptop and charger? <select id="f-laptop" name="laptop" required><option value="">Choose</option><option>Yes</option><option>No</option></select></label>
    <label for="f-ae">Your Salesforce account executive <small>Optional.</small><input id="f-ae" name="account_executive"></label>
    <label for="f-notes">Anything else? <small>Prefer another date or city? Tell us.</small><textarea id="f-notes" name="notes" rows="2"></textarea></label>
    <div class="err" id="err" role="alert">${esc(formErr)}</div>
    <button class="btn" type="submit" ${busy?"disabled":""}>${busy ? "Sending…" : "Register your interest"}</button>
    <div class="note">Your account team will be in touch to confirm your place.</div>
  </form></div>`;
}
function renderForm(){
  const col = document.getElementById("formcol"); if (!col) return;
  const keep = {}; col.querySelectorAll("input,select,textarea").forEach(e => keep[e.id] = e.value);
  col.innerHTML = formCard(route());
  Object.entries(keep).forEach(([id,v]) => { const e = document.getElementById(id); if (e) e.value = v; });
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "reg") return;
  e.preventDefault();
  const city = route(), form = e.target, v = id => document.getElementById(id).value.trim();
  if (!v("f-name") || !v("f-title") || !v("f-company") || !v("f-tab") || !v("f-laptop") || !/^\S+@\S+\.\S+$/.test(v("f-email"))) {
    formErr = "Please complete every required field with a valid email."; renderForm(); return;
  }
  if (form.company_website.value) { sent[city] = true; renderForm(); return; } // spam trap
  const body = new URLSearchParams();
  body.append(ENTRY.city, city);
  ["name","title","email","company","uses_tableau","laptop","account_executive","notes"].forEach(k => body.append(ENTRY[k], form.elements[k].value.trim()));
  formErr = ""; busy = true; renderForm();
  try {
    // Google Forms gives other sites no readable reply, so a sent request counts as success.
    await fetch(FORM_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body});
    sent[city] = true;
  } catch (err) {
    formErr = "We couldn't submit your registration. Please try again, or contact your account executive.";
  }
  busy = false; renderForm();
});

function registerCard(k){
  if (FORM_ENDPOINT) return formCard(k);
  const link = registerLink(k), c = CITIES[k];
  const btn = link
    ? `<a class="btn" href="${esc(link)}" ${link.startsWith("mailto:") ? "" : 'target="_blank" rel="noopener"'}>Register your interest</a>`
    : `<button class="btn" type="button" disabled>Registration opens soon</button>`;
  return `<div class="card"><h2>Register your interest</h2>
    <p>Join us in ${esc(c.name)} for a hands-on ${c.part || 'afternoon'} with Tableau and AI. Places are limited, and your account team will be in touch to confirm yours.</p>
    <p>${btn}</p>
    <p class="note">You'll be asked for your name, job title, work email, company, whether you use Tableau, and whether you can bring a laptop and charger. <strong>Please remember to bring photo ID, which is required to enter the building.</strong></p></div>`;
}
function cityPage(k){
  const c = CITIES[k];
  return `<section class="hero">${BARS}<div class="eyebrow">CBS Tableau AI Workshop</div>
    <h1>${c.name}</h1>
    <p>A hands-on ${c.part || 'afternoon'} with the latest Tableau innovation: Pulse, AI agents, Tableau Studio, and MCP integrations with Claude, Slack, or any front end you use.</p>
</section>
    <section class="details" aria-label="Event details"><div><span>Date</span><b>${esc(c.date)}</b></div><div><span>Time</span><b>${esc(c.time)}</b></div><div><span>Venue</span><b>${esc(c.venue)}</b></div></section>
    ${TOPICS}
    <div class="grid"><div class="col"><h2>What to bring</h2><ul class="agenda"><li><div><strong>Photo ID <em class="req">Required</em></strong><span>You must show photo ID to enter the building. We can't admit guests without it.</span></div></li><li><div><strong>A laptop and charger</strong><span>The session is hands-on, so you'll build as we go.</span></div></li><li><div><strong>Your Tableau questions</strong><span>Your account team will be on hand to help.</span></div></li></ul></div>
    <div class="col" id="formcol">${registerCard(k)}</div></div>`;
}
function render(){
  nav();
  const r = route(), app = $("#app");
  app.innerHTML = CITIES[r] ? cityPage(r) : home();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

render();
</script>
</body>
</html>
